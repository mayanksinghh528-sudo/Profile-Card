<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <style>
        .con{
            height: 600px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .box{
            height: 80%;
            width: 80%;
            display: flex;
            box-shadow: 10px 10px 10px;
            border-radius: 20px;
        }
        .left,.right,.center{
            height: 100%;
        }
        .left{
            width: 3%;
            background-color: navy;
            border-radius: 30px;
        }
        .center{
            width: 65%;
            font-size: 60px;
            color: navy;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        h1{
            margin-left: 10px;
        }
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        .right{
            width: 35%;
        }
        .top{
            height: 30%;
        }
        .bottom{
            height: 70%;
        }
        .bottom>h1{
            text-align: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: navy;
        }
        .top-in{
            height: 90%;
            background-color: navy;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
        }
        .circle{
            height: 120px;
            width: 120px;
            border: 1px solid black;
            border-radius: 50%;
            position: absolute;
            top: 85px;
            right: 260px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        img{
            height: 100%;
            width: 100%;
            border-radius: 50%;
            border: 2px solid white;
        }
        .button{
            height: 20%;
            display: flex;
            align-items: center;
            justify-content: space-evenly;
        }
        .button1{
            height: 50%;
            width: 40%;
            background-color: navy;
            border-radius: 20px;
            color: white;
            text-align: center;
            line-height: 30px;
        }
        .icon{
            height: 20%;
            display: flex;
            align-items: center;
            justify-content: space-around;
        }
        .fa-instagram{
            background: linear-gradient(purple,red,yellow,orange);
            color: transparent;
            background-clip: text;
        }
        .fa-facebook{
            color: blue;
        }
        .fa-github{
            color: blueviolet;
        }
        .fa-linkedin{
            color: blue;
        }
        .fa-behance{
            color: blue;
        }

        </style>
</head>
<body>
    <div class="con">
        <div class="box">
            <div class="left"></div>
            <div class="center"> 
                <h1>Profile Card UI UX Design</h1>
            </div>
                <div class="right">
                    <div class="top">
                        <div class="top-in">
                            <div class="circle">
                                <img src="Annotation 2026-08-21 134935.png" alt="">
                            </div>
                        </div>
                    </div>
                    <div class="bottom">
                          <h1>Website Developer</h1>
                           <h1>Dezyne École College</h1>
                          <h1>BCA 1st year</h1>
                          <div class="icon">
                            <i class="fa fa-brands fa-2x fa-instagram"></i>
                             <i class="fa fa-brands fa-2x fa-facebook"></i>
                              <i class="fa fa-brands fa-2x fa-github"></i>
                               <i class="fa fa-brands fa-2x fa-linkedin"></i>
                               <i class="fa fa-brands fa-2x fa-behance"></i>
                          </div>
        <div class="button">
            <div class="button1">
                Subscribe
            </div>
            <div class="button1">
                Message
            </div>
        </div>
        <div class="icon">
            <i class="fa fa-solid fa-heart"></i>60.4K
            <i class="fa fa-solid fa-comment"></i>20K
            <i class="fa fa-solid fa-share"></i>12.6K
            
        </div>
    </div>
        </div>
    
    </div>
    
</body>
</html>
